<svg xmlns="http://www.w3.org/2000/svg" width="837" height="462" font-family="DejaVu Sans Mono, monospace" font-size="16"><rect width="837" height="462" fill="#1e1e1e"/><rect width="837" height="52" fill="#2d2d2d"/><circle cx="22" cy="26" r="7" fill="#ff5f56"/><circle cx="48" cy="26" r="7" fill="#ffbd2e"/><circle cx="74" cy="26" r="7" fill="#27c93f"/><text x="110" y="32" fill="#dcdcdc" font-size="15" font-weight="bold">soal2_validasi_data.py  -  Terminal</text><text x="28" y="88" fill="#50fa7b" font-weight="bold">$ python praktikum/soal2_validasi_data.py</text><text x="28" y="114" fill="#ebebeb" font-weight="normal"> </text><text x="28" y="140" fill="#ebebeb" font-weight="normal">=== Soal 2: validasi_data() ===</text><text x="28" y="166" fill="#ebebeb" font-weight="normal"> </text><text x="28" y="192" fill="#ebebeb" font-weight="normal">Data valid:</text><text x="28" y="218" fill="#ebebeb" font-weight="normal">  (True, [])</text><text x="28" y="244" fill="#ebebeb" font-weight="normal"> </text><text x="28" y="270" fill="#ebebeb" font-weight="normal">Data tidak valid (dengan field wajib tambahan &#x27;email&#x27; via *args):</text><text x="28" y="296" fill="#ebebeb" font-weight="normal">  is_valid = False</text><text x="28" y="322" fill="#ebebeb" font-weight="normal">  - Field &#x27;email&#x27; wajib diisi (dari *args)</text><text x="28" y="348" fill="#ebebeb" font-weight="normal">  - Field &#x27;nama&#x27; minimal 3 karakter/item</text><text x="28" y="374" fill="#ebebeb" font-weight="normal">  - Field &#x27;umur&#x27; = 15 di bawah minimum 17</text><text x="28" y="400" fill="#ebebeb" font-weight="normal">  - Field &#x27;ipk&#x27; = 4.5 di atas maksimum 4.0</text><text x="28" y="426" fill="#ebebeb" font-weight="normal">  - Field &#x27;status&#x27; harus salah satu dari [&#x27;Aktif&#x27;, &#x27;Cuti&#x27;, &#x27;Lulus&#x27;, &#x27;Nonaktif&#x27;]</text></svg>