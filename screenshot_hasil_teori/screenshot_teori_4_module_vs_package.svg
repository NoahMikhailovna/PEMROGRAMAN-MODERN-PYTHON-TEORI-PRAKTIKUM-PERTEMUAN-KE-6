<svg xmlns="http://www.w3.org/2000/svg" width="760" height="395" font-family="DejaVu Sans Mono, monospace" font-size="17"><rect width="760" height="395" fill="#1e1e1e"/><rect width="760" height="52" fill="#2d2d2d"/><circle cx="22" cy="26" r="7" fill="#ff5f56"/><circle cx="48" cy="26" r="7" fill="#ffbd2e"/><circle cx="74" cy="26" r="7" fill="#27c93f"/><text x="110" y="32" fill="#dcdcdc" font-size="15" font-weight="bold">teori_4_module_vs_package.py  -  Terminal</text><text x="28" y="88" fill="#50fa7b" font-weight="bold">$ python teori_4_module_vs_package.py</text><text x="28" y="115" fill="#ebebeb" font-weight="normal"> </text><text x="28" y="142" fill="#ebebeb" font-weight="normal">=== Teori 4: Module vs Package ===</text><text x="28" y="169" fill="#ebebeb" font-weight="normal">Module math : sqrt(144) = 12.0, pi = 3.1416</text><text x="28" y="196" fill="#ebebeb" font-weight="normal">Module json : dumps     = {&quot;nama&quot;: &quot;Fakhry&quot;, &quot;ipk&quot;: 3.75}</text><text x="28" y="223" fill="#ebebeb" font-weight="normal">Package collections.Counter: {&#x27;kopi&#x27;: 3, &#x27;teh&#x27;: 2}</text><text x="28" y="250" fill="#ebebeb" font-weight="normal">Nama module ini (__name__): __main__</text><text x="28" y="277" fill="#ebebeb" font-weight="normal">File module ini (__file__): teori_4_module_vs_package.py</text><text x="28" y="304" fill="#ebebeb" font-weight="normal"> </text><text x="28" y="331" fill="#ebebeb" font-weight="normal">Kesimpulan: module = 1 file .py, package = folder berisi</text><text x="28" y="358" fill="#ebebeb" font-weight="normal">module-module yang ditandai dengan __init__.py.</text></svg>