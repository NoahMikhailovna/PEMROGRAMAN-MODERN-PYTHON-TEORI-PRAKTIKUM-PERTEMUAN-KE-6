<svg xmlns="http://www.w3.org/2000/svg" width="833" height="395" font-family="DejaVu Sans Mono, monospace" font-size="17"><rect width="833" height="395" fill="#1e1e1e"/><rect width="833" height="52" fill="#2d2d2d"/><circle cx="22" cy="26" r="7" fill="#ff5f56"/><circle cx="48" cy="26" r="7" fill="#ffbd2e"/><circle cx="74" cy="26" r="7" fill="#27c93f"/><text x="110" y="32" fill="#dcdcdc" font-size="15" font-weight="bold">teori_3_mutable_default_pitfall.py  -  Terminal</text><text x="28" y="88" fill="#50fa7b" font-weight="bold">$ python teori_3_mutable_default_pitfall.py</text><text x="28" y="115" fill="#ebebeb" font-weight="normal"> </text><text x="28" y="142" fill="#ebebeb" font-weight="normal">=== Teori 3: Mutable Default Pitfall ===</text><text x="28" y="169" fill="#ebebeb" font-weight="normal"> </text><text x="28" y="196" fill="#ebebeb" font-weight="normal">Cara SALAH (default = []):</text><text x="28" y="223" fill="#ebebeb" font-weight="normal">  tambah_item_salah(&#x27;apel&#x27;)  -&gt; [&#x27;apel&#x27;]</text><text x="28" y="250" fill="#ebebeb" font-weight="normal">  tambah_item_salah(&#x27;jeruk&#x27;) -&gt; [&#x27;apel&#x27;, &#x27;jeruk&#x27;]  &lt;- &#x27;apel&#x27; ikut terbawa!</text><text x="28" y="277" fill="#ebebeb" font-weight="normal"> </text><text x="28" y="304" fill="#ebebeb" font-weight="normal">Cara BENAR (default = None):</text><text x="28" y="331" fill="#ebebeb" font-weight="normal">  tambah_item_benar(&#x27;apel&#x27;)  -&gt; [&#x27;apel&#x27;]</text><text x="28" y="358" fill="#ebebeb" font-weight="normal">  tambah_item_benar(&#x27;jeruk&#x27;) -&gt; [&#x27;jeruk&#x27;]  &lt;- bersih, list baru</text></svg>