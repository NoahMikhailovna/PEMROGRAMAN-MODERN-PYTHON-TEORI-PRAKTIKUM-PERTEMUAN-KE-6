<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" font-family="DejaVu Sans Mono, monospace" font-size="17"><rect width="760" height="476" fill="#1e1e1e"/><rect width="760" height="52" fill="#2d2d2d"/><circle cx="22" cy="26" r="7" fill="#ff5f56"/><circle cx="48" cy="26" r="7" fill="#ffbd2e"/><circle cx="74" cy="26" r="7" fill="#27c93f"/><text x="110" y="32" fill="#dcdcdc" font-size="15" font-weight="bold">teori_5_lambda_vs_def.py  -  Terminal</text><text x="28" y="88" fill="#50fa7b" font-weight="bold">$ python teori_5_lambda_vs_def.py</text><text x="28" y="115" fill="#ebebeb" font-weight="normal"> </text><text x="28" y="142" fill="#ebebeb" font-weight="normal">=== Teori 5: Lambda vs def ===</text><text x="28" y="169" fill="#ebebeb" font-weight="normal">Lambda kuadrat(5) = 25</text><text x="28" y="196" fill="#ebebeb" font-weight="normal"> </text><text x="28" y="223" fill="#ebebeb" font-weight="normal">Diurutkan IPK tertinggi (lambda sebagai key sorted):</text><text x="28" y="250" fill="#ebebeb" font-weight="normal">  Ani: 3.9 -&gt; Cumlaude (pakai def)</text><text x="28" y="277" fill="#ebebeb" font-weight="normal">  Budi: 3.75 -&gt; Cumlaude (pakai def)</text><text x="28" y="304" fill="#ebebeb" font-weight="normal">  Cici: 3.6 -&gt; Cumlaude (pakai def)</text><text x="28" y="331" fill="#ebebeb" font-weight="normal">  Dani: 2.4 -&gt; Perlu Perbaikan (pakai def)</text><text x="28" y="358" fill="#ebebeb" font-weight="normal"> </text><text x="28" y="385" fill="#ebebeb" font-weight="normal">Nilai asal        : [78, 85, 92, 67, 90]</text><text x="28" y="412" fill="#ebebeb" font-weight="normal">map lambda /100   : [0.78, 0.85, 0.92, 0.67, 0.9]</text><text x="28" y="439" fill="#ebebeb" font-weight="normal">filter lambda &gt;=80: [85, 92, 90]</text></svg>